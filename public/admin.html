<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1f1d;--mut:#6a706b;--line:#e2e0d8;--ac:#1f5f4a;--acx:#fff;--warn:#b4531a;--ok:#1f7a4a;--in:#fbfaf6}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--card:#1b1f1c;--ink:#ecece6;--mut:#9aa19b;--line:#2b312d;--ac:#4cc19a;--acx:#0c1a14;--warn:#e8934f;--ok:#58c88a;--in:#151916}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}header small{color:var(--mut)}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
input,select,textarea{background:var(--in);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.tools>*{width:auto}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);z-index:2;text-align:left;font-size:12px;color:var(--mut)}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);font-weight:700;z-index:1}th:first-child{z-index:3}
td input,td select{min-width:92px;padding:5px 6px}td select{min-width:118px}td input.s{min-width:70px;width:74px}
tr.ch td{background:color-mix(in srgb,var(--warn) 12%,var(--card))}tr.ch td:first-child{background:color-mix(in srgb,var(--warn) 12%,var(--card))}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent)}.msg.er{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.login{max-width:360px;margin:12vh auto}.hint{color:var(--mut);font-size:13px}
.dirty{color:var(--warn);font-weight:600}
</style></head><body>

 ['data','ato','atoN','desc','obsAvista','obs'].forEach(k=>$('#c_'+k).oninput=e=>{const v=e.target.value;S.cfg[k]=['ato','atoN','desc'].includes(k)?(isNaN(num(v))?'':num(v)):v;hdr()});
 $('#hoje').onclick=()=>{S.cfg.data=new Date().toLocaleDateString('pt-BR');vCond();hdr()}}
function vCorr(){const B=S.brokers;
 $('#body').innerHTML=`<div class="card"><p class="hint" style="margin-top:0">Cada corretor tem um link próprio da página, e o botão de WhatsApp vai para o número dele. O "padrao" vale para quem entra sem código.</p><div class="tw"><table><thead><tr><th>Código (link)</th><th>Nome</th><th>WhatsApp (55 + DDD + número)</th><th>Link</th><th></th></tr></thead><tbody>${Object.entries(B).map(([k,b])=>`<tr data-k="${esc(k)}"><td>${esc(k)}</td><td><input data-f="nome" value="${esc(b.nome)}"></td><td><input data-f="whatsapp" value="${esc(b.whatsapp)}" placeholder="5521999999999"></td><td class="hint">${k=='padrao'?location.origin+'/':location.origin+'/?c='+esc(k)}</td><td>${k=='padrao'?'':'<button class="btn sec" data-d="1">Remover</button>'}</td></tr>`).join('')}</tbody></table></div>
 <div class="tools" style="margin-top:12px"><div><label>Novo corretor (código curto, sem espaço)</label><input id="nk" placeholder="joao" style="width:160px"></div><button class="btn sec" id="add">Adicionar</button></div></div>`;
 $('tbody').onchange=e=>{const tr=e.target.closest('tr');B[tr.dataset.k][e.target.dataset.f]=e.target.value;hdr()};
 $('tbody').onclick=e=>{if(!e.target.dataset.d)return;delete B[e.target.closest('tr').dataset.k];vCorr();hdr()};
 $('#add').onclick=()=>{const k=$('#nk').value.toLowerCase().replace(/[^a-z0-9-]/g,'');if(!k||B[k])return;B[k]={nome:'',whatsapp:''};vCorr();hdr()}}
addEventListener('beforeunload',e=>{if(tok&&dirty()){e.preventDefault();e.returnValue=''}});
